# Halo Competitive ANZ - Project Reclaimer dedicated servers.
#
# Reference for every setting: https://projectreclaimer.dev/host.html
#
# Secrets never go in this file. The RCON password and any join password come
# from .env (RECLAIMER_DEDICATED_RCON_PASSWORD, RECLAIMER_DEDICATED_PASSWORD),
# which is gitignored. `npm run validate` fails if either is set here.

game = "game"                 # copied from your own MCC install, gitignored
content = "content"           # Maps, Game Modes and Mods every server shares
public_address = ""           # empty: detected. Set the VPS's IP or DNS name if detection is wrong.
upnp = false                  # off on a VPS
auto_update = false           # Docker: set RECLAIMER_DEDICATED_AUTO_UPDATE in .env instead
host_name = "Halo Competitive ANZ"

# Player IDs (64 hex characters, Settings -> Connectivity -> Your player ID in
# the client) who may kick and ban on every server. Add to this list by PR.
admins = []

[master]
enabled = true
port = 49175                  # TCP

[rcon]
password = ""                 # set in .env, never here
address = "127.0.0.1"         # reach it through an SSH tunnel, not the open internet

[defaults]
voice = true
text_chat = true
votes = true
max_players = 16
team_changing = "balanced"
share_mods = true             # players without a mod download it from the server
share_rate = 20               # Mbit/s, all of one server's downloads together

# Every server needs its own UDP port, and GAME_PORTS in .env must cover it.

[[server]]
name = "ANZ Starter Rotation"
port = 49176
playlist = "playlists/starter.playlist.json"

[[server]]
name = "ANZ Hardcore"
port = 49177
playlist = "playlists/hardcore.playlist.json"
max_players = 8
team_changing = "off"         # MLG v8: Team Changing = Not Allowed
# Needs scripts/copy-mcc-content.ps1 run on the host; see docs/hosting.md.
